name: Pages

on:
  push:
    branches: [main]
    paths: ["web/**", "slides/**", "docs/video/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site (demo at /, slides at /slides/)
        run: |
          mkdir -p _site
          cp -r web/. _site/
          if [ -d slides ]; then mkdir -p _site/slides && cp -r slides/. _site/slides/; fi
          mkdir -p _site/video && cp docs/video/*.mp4 _site/video/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
